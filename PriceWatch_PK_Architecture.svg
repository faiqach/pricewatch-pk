<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f3f7ff"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9f5ff"/>
      <stop offset="100%" stop-color="#d3ebff"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eefbf1"/>
      <stop offset="100%" stop-color="#dcf4de"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ebff"/>
      <stop offset="100%" stop-color="#e4d5ff"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#ffe2b8"/>
    </linearGradient>
    <linearGradient id="layer5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeef2"/>
      <stop offset="100%" stop-color="#ffdce5"/>
    </linearGradient>
    <linearGradient id="external" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#e3e8ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4b5563" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1800" height="1250" fill="url(#bg)"/>
  <rect x="40" y="40" width="1720" height="1170" rx="24" fill="white" stroke="#dce6f5" stroke-width="2"/>

  <text x="900" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">PriceWatch PK — System Architecture v1.0</text>
  <text x="900" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">IUB Final Year Project | Supervisor: Dr. Malik Muhammad Saad Missen</text>

  <g filter="url(#shadow)">
    <rect x="90" y="170" width="500" height="240" rx="20" fill="url(#layer1)" stroke="#6aaee8" stroke-width="2"/>
    <rect x="90" y="170" width="500" height="44" rx="20" fill="#7cc0ff"/>
    <text x="340" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Layer 1 — Mobile App (Flutter)</text>
    <text x="120" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Flutter App (Android 8+ / iOS 13+)</text>
    <text x="120" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Screens: Home Dashboard, Price Charts, AI Forecast</text>
    <text x="120" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Anomaly Alerts, Profile</text>
    <text x="120" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• State: Provider / Riverpod | HTTP: Dio</text>
    <text x="120" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Charts: fl_chart | Cache: SharedPreferences</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="470" width="560" height="270" rx="20" fill="url(#layer2)" stroke="#69c982" stroke-width="2"/>
    <rect x="90" y="470" width="560" height="44" rx="20" fill="#8fe0a0"/>
    <text x="370" y="498" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Layer 2 — Backend API (FastAPI / Python)</text>
    <text x="120" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• /auth: Register, Login (bcrypt + JWT)</text>
    <text x="120" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• /prices: Latest prices, price history</text>
    <text x="120" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• /predict: AI price forecast</text>
    <text x="120" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• /anomalies: Overpricing alerts</text>
    <text x="120" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• /admin: Approval queue, approve/reject</text>
    <text x="120" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Middleware: JWT Auth + Rate Limiter (100 req/min)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="800" width="520" height="200" rx="20" fill="url(#layer3)" stroke="#a77bf5" stroke-width="2"/>
    <rect x="90" y="800" width="520" height="44" rx="20" fill="#c99eff"/>
    <text x="350" y="828" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Layer 3 — Database (PostgreSQL 13+)</text>
    <text x="120" y="875" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• users | admin_users | cities | commodities</text>
    <text x="120" y="905" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• official_prices | vendor_prices | predictions</text>
    <text x="120" y="935" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• anomalies | news_articles | scraping_logs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="470" width="480" height="300" rx="20" fill="url(#layer4)" stroke="#f0a23b" stroke-width="2"/>
    <rect x="730" y="470" width="480" height="44" rx="20" fill="#ffbf66"/>
    <text x="970" y="498" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Layer 4 — Background Pipeline</text>
    <text x="760" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• APScheduler triggers daily at 06:00 AM PKT</text>
    <text x="760" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Step 1: BeautifulSoup scraper</text>
    <text x="760" y="605" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Step 2: Selenium scraper</text>
    <text x="760" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Step 3: Pillow pre-processing</text>
    <text x="760" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Step 4: Tesseract OCR | Step 5: pdfplumber</text>
    <text x="760" y="695" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Step 6: JSON parser → scraping_logs (Awaiting Approval)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="980" width="520" height="180" rx="20" fill="url(#layer5)" stroke="#f06c92" stroke-width="2"/>
    <rect x="660" y="980" width="520" height="44" rx="20" fill="#ff8aa7"/>
    <text x="920" y="1008" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Layer 5 — Admin Web Panel</text>
    <text x="690" y="1055" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Approval Queue | Anomaly Management</text>
    <text x="690" y="1085" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Stats Dashboard | Scraping Logs</text>
    <text x="690" y="1115" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• RBAC: super_admin / data_operator</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1320" y="260" width="360" height="220" rx="20" fill="url(#external)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1320" y="260" width="360" height="44" rx="20" fill="#cbd5e1"/>
    <text x="1500" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">External — OpenRouter AI API</text>
    <text x="1348" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Primary: Google Gemini Flash 1.5</text>
    <text x="1348" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Fallback: xAI Grok</text>
    <text x="1348" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• Used for: price trend prediction</text>
    <text x="1348" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">• and anomaly detection</text>
  </g>

  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow2)">
    <line x1="340" y1="410" x2="340" y2="468"/>
    <line x1="340" y1="740" x2="340" y2="798"/>
    <line x1="650" y1="605" x2="728" y2="605"/>
    <line x1="1210" y1="605" x2="1318" y2="370"/>
    <line x1="1500" y1="480" x2="1500" y2="520"/>
    <line x1="1180" y1="1040" x2="660" y2="1040"/>
    <line x1="610" y1="600" x2="660" y2="980"/>
    <line x1="340" y1="410" x2="340" y2="440"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,6 L0,3 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">
    <text x="352" y="442" text-anchor="middle">HTTPS REST (JWT)</text>
    <text x="352" y="770" text-anchor="middle">SQLAlchemy ORM</text>
    <text x="690" y="595">HTTPS POST (price history JSON)</text>
    <text x="1260" y="580">JSON response (forecast + anomaly)</text>
    <text x="1500" y="510" text-anchor="middle">Direct DB write</text>
    <text x="920" y="1030" text-anchor="middle">HTTPS REST /admin</text>
    <text x="640" y="780">Approval queue data</text>
    <text x="352" y="430" text-anchor="middle">Published prices</text>
  </g>

  <rect x="80" y="1140" width="760" height="70" rx="16" fill="#f8fafc" stroke="#dbe4f0" stroke-width="1.5"/>
  <text x="100" y="1172" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Legend</text>
  <line x1="100" y1="1195" x2="170" y2="1195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="180" y="1201" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Request / data flow</text>
  <line x1="330" y1="1195" x2="400" y2="1195" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="410" y="1201" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Scheduled / background process</text>
</svg>
